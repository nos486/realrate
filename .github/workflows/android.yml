# Android app: builds the signed release APK from the web app (web/) and its Android shell (web/android).
# Push to main publishes a signed release APK when the signing secrets are set (see docs/ANDROID.md).
# The APK is published as a GitHub release (v1.0.<run>), always downloadable as releases/latest/download/realrate.apk.
name: Android

on:
  push:
    branches: [main]
    paths: ['web/**', 'api/src/domain/**', 'package-lock.json', '.github/workflows/android.yml', 'CHANGELOG.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing the release
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build the web app into the Android project
        working-directory: web
        env:
          # The app tells the server its version (X-RealRate-Client, for the admin panel)
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
        run: |
          npm run build:app
          npx cap sync android

      - name: Release APK (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: realrate-release-${{ env.VERSION_NAME }}
          path: web/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Extract Release Notes from CHANGELOG.md
        if: env.HAS_SIGNING == 'true'
        run: |
          node -e '
          const fs = require("node:fs");
          const versionName = process.env.VERSION_NAME;
          const repo = process.env.GITHUB_REPOSITORY;
          let notes = "";

          if (fs.existsSync("CHANGELOG.md")) {
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const sections = content.split(/\n(?=##\s+)/);

            let target = sections.find(s => {
              const firstLine = (s.split("\n")[0] || "").toLowerCase();
              return firstLine.includes(versionName.toLowerCase()) ||
                     firstLine.includes("unreleased") ||
                     firstLine.includes("در حال انتشار") ||
                     firstLine.includes("نسخه جدید") ||
                     firstLine.includes("آخرین تغییرات");
            });

            if (!target) {
              target = sections.find(s => s.trim().startsWith("##"));
            }

            if (target) {
              const lines = target.trim().split("\n");
              lines.shift(); // remove the ## header line
              notes = lines.join("\n").trim();
            }
          }

          if (!notes) {
            notes = `نسخه‌ی ${versionName} اپ اندروید (امضاشده).`;
          }

          const footer = `\n\n---\n**دانلود مستقیم آخرین نسخه:** [realrate.apk](https://github.com/${repo}/releases/latest/download/realrate.apk)`;
          fs.writeFileSync(process.env.RUNNER_TEMP + "/release_notes.md", notes + footer, "utf8");
          '

      - name: Publish the signed APK as a release
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION_NAME"
          apk=$(ls web/android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "$RUNNER_TEMP/realrate.apk"
          # The tag first: creating it while publishing the release has failed with HTTP 500
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run (or a publish that failed half way): replace the file, make sure it is out
            gh release upload "$tag" "$RUNNER_TEMP/realrate.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
              --title "RealRate $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release_notes.md"
          else
            gh release create "$tag" "$RUNNER_TEMP/realrate.apk" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "RealRate $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release_notes.md"
          fi
