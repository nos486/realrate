# Self-hosted deploy: on every push to main, run the API tests, then update the Linux host over SSH
# (deploy/deploy.sh there: pull this commit, rebuild the two containers, wait until healthy).
# Off until the repository variable SELF_HOSTED_DEPLOY is "true" (Settings → Secrets and
# variables → Actions); secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, optional DEPLOY_PORT,
# DEPLOY_PATH (default /opt/realrate). See docs/SELF_HOST.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order (a newer push waits for the one running)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    if: vars.SELF_HOSTED_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --no-file-parallelism
        working-directory: api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Update the host
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_PATH: ${{ secrets.DEPLOY_PATH || '/opt/realrate' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" "cd '$APP_PATH' && ./deploy/deploy.sh '${{ github.sha }}'"
