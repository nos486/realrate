# CI: runs the full test suite, lint and build on every pull request to main,
# so local work can run only the tests related to a change.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: API and UI tests (Vitest)
        working-directory: api
        run: npx vitest run

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Web SEO tests
        working-directory: web
        run: npm test
