name = "realrate-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
# The Postgres driver (pg) needs Node.js APIs
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_USD_TOMAN = ""
DEFAULT_GOLD_USD = "4000"
ADMIN_EMAIL = "nos486@gmail.com"
GOOGLE_CLIENT_ID = "420432138114-sfg3n1k34ke674192pct6envne50o1c7.apps.googleusercontent.com"
# GOOGLE_CLIENT_SECRET: For production, run `wrangler secret put GOOGLE_CLIENT_SECRET`
# GOOGLE_REDIRECT_URI: Optional override. Defaults to {request.origin}/api/auth/google/callback

[[kv_namespaces]]
binding = "REALRATE_KV"
id = "4c1bbe085e964f2a8d3eb82a17befde8"

# D1: where the app's data was before Postgres. Only read by the one-time move to Postgres
# (admin panel → پایگاه داده); removed once the move is done.
[[d1_databases]]
binding = "DB"
database_name = "realrate-db"
database_id = "19efe9ed-fc88-4e87-aaee-43ba6c6b3797"

[triggers]
crons = ["* * * * *"]


# Postgres: the app's database (after the move from D1) and the price history.
# Query caching must be off for this Hyperdrive, or a page may read data from before a save:
#   npx wrangler hyperdrive update c503e09fe4334a2c8351480139a9bce7 --caching-disabled true
# Local dev: point localConnectionString at a local Postgres.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "c503e09fe4334a2c8351480139a9bce7"
localConnectionString = "postgres://postgres:postgres@localhost:5432/realrate"
