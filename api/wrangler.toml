name = "realrate-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Plain variables live here, not in the Cloudflare dashboard: `wrangler deploy` replaces the
# dashboard's variables with these (secrets, such as RESEND_API_KEY, are kept)
[vars]
ADMIN_EMAIL = "nos486@gmail.com"
# The sender of verification, password-reset and reminder emails (a domain verified in Resend)
EMAIL_FROM = "RealRate <no-reply@geekio.org>"
GOOGLE_CLIENT_ID = "420432138114-sfg3n1k34ke674192pct6envne50o1c7.apps.googleusercontent.com"
# GOOGLE_CLIENT_SECRET: For production, run `wrangler secret put GOOGLE_CLIENT_SECRET`
# GOOGLE_REDIRECT_URI: Optional override. Defaults to {request.origin}/api/auth/google/callback

[triggers]
crons = ["* * * * *"]


# Run next to the D1 database (fewer round trips for requests that run several queries)
[placement]
mode = "smart"

# D1: every table (users, sessions, the encrypted vault, the daily price history, counters).
# Created with `npx wrangler d1 create realrate`; tables are created on first use.
[[d1_databases]]
binding = "DB"
database_name = "realrate"
database_id = "2bcc7e2d-08c4-45e1-819b-114dbf1a9358"

# KV: the price book and each price source's items (read on every price request).
# Created with `npx wrangler kv namespace create realrate-prices`.
[[kv_namespaces]]
binding = "KV"
id = "6a9d627b16a245a598b83a37d8254b6f"

# Durable Object history: RateGate was added (v1) and removed (v2); keep both entries
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateGate"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateGate"]
