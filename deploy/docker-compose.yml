# RealRate on one Linux host — two containers, Postgres stays where it is (on this host)
#
#   api  the API (api/server.js: the same code as the Cloudflare Worker, plus the per-minute cron)
#   web  Caddy: the website's files and HTTPS for both domains, proxying the API domain to `api`
#
# Both use the host's network: the API reaches the host's Postgres on 127.0.0.1 (no pg_hba or
# listen_addresses change) and listens on 127.0.0.1 only; Caddy takes ports 80 and 443.
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
# Updates: deploy/deploy.sh (the GitHub workflow runs it on every push to main).

name: realrate

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: realrate-api:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${API_PORT:-8787}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8787) + '/api/auth/me').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Lets a deploy finish work still running (price sync, emails) before the old one stops
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: realrate-web:latest
    restart: unless-stopped
    network_mode: host
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      API_PORT: ${API_PORT:-8787}
      EDGE: ${EDGE:-direct}
    volumes:
      # Certificates survive restarts and rebuilds (Let's Encrypt limits new ones)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
