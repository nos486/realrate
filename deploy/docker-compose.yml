# RealRate on one Linux host, behind the host's own nginx (which keeps ports 80 / 443 and TLS)
#
#   web  the website: built files served on 127.0.0.1:${WEB_PORT} (nginx proxies the domain here)
#   api  the API (api/server.js: the Worker's code plus the per-minute cron) — step 2, off until
#        COMPOSE_PROFILES=api is set in deploy/.env; until then the site keeps using the Worker
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
# Updates: deploy/deploy.sh (the GitHub workflow runs it on every push to main).

name: realrate

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: realrate-web:latest
    restart: unless-stopped
    ports:
      # Only this host's nginx can reach it
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: realrate-api:latest
    restart: unless-stopped
    # The host's network: Postgres on 127.0.0.1 without changing pg_hba.conf; listens on
    # 127.0.0.1:${API_PORT} only (nginx proxies the API domain here)
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${API_PORT:-8787}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8787) + '/api/auth/me').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Lets a deploy finish work still running (price sync, emails) before the old one stops
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
